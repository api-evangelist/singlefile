          type:
          - string
          - 'null'
          maxLength: 20
        country:
          title: Country
          type:
          - string
          - 'null'
          maxLength: 100
        country_code:
          title: Country code
          type:
          - string
          - 'null'
          maxLength: 10
        country_area:
          title: Country area
          type:
          - string
          - 'null'
          maxLength: 100
        city_area:
          title: City area
          type:
          - string
          - 'null'
          maxLength: 100
        sorting_code:
          title: Sorting code
          type:
          - string
          - 'null'
          maxLength: 100
    ContactList:
      type: object
      properties:
        id:
          title: Id
          type:
          - string
          - 'null'
          readOnly: true
        name:
          title: Name
          type: string
