components:
  schemas:
    DocumentUpload:
      required:
      - filing_type
      type: object
      properties:
        file:
          title: File
          description: Document file to upload (PDF, DOCX)
          type: string
          readOnly: true
          format: uri
        title:
          title: Title
          description: Document title (auto-generated if not provided)
          type: string
          maxLength: 1000
          minLength: 1
        description:
          title: Description
          description: Document description
          type: string
          maxLength: 5000
          minLength: 1
        entity_id:
          title: Entity id
          description: ID of the entity to associate with this document
          type: string
          format: uuid
        organization_id:
          title: Organization id
          description: ID of the organization (required if entity_id not provided)
          type: string
          format: uuid
        jurisdiction:
          title: Jurisdiction
          description: Jurisdiction for the document
          type: string
          maxLength: 500
          minLength: 1
        filing_type:
          title: Filing type
          description: Filing type for the document
          type: string
          maxLength: 100
          minLength: 1
        document_type:
          title: Document type
          description: Document type (e.g., FILING, EVIDENCE, CORPORATE_RECORDS)
          type: string
          maxLength: 100
          minLength: 1
    EntityContactCreateRequest:
      type: object
      properties:
        primary_contact:
          $ref: '#/components/schemas/ContactCreate'
        billing_contact:
          $ref: '#/components/schemas/ContactCreate'
        authorized_contact:
          $ref: '#/components/schemas/ContactCreate'
    GrossAsset:
      required:
      - date
      - assets
      type: object
      properties:
        date:
          title: Date
          type: string
          format: date
        assets:
          title: Assets
          type: string
          format: decimal
    JurisdictionDetail:
      required:
      - registration_type
      - state_file_number
      - status
      - has_annual_report_subscription
      - is_registered_agent
      type: object
      properties:
        id:
          title: Id
          type:
          - string
          - 'null'
          readOnly: true
        name:
          title: Jurisdiction
          type:
          - string
          - 'null'
          maxLength: 100
        organization_id:
          title: Organization id
          type: string
          readOnly: true
        entity_id:
          title: Entity id
          type: string
          readOnly: true
        registration_type:
          title: Registration type
          type: string
          minLength: 1
        state_file_number:
          title: State file number
          type: string
          minLength: 1
        registration_date:
          title: Registration date
          type:
          - string
          - 'null'
          format: date
        expiration_date:
          title: Expiration date
          type:
          - string
          - 'null'
          format: date
        status:
          title: Status
          type: string
          minLength: 1
        has_annual_report_subscription:
          title: Has annual report subscription
          type: boolean
        is_registered_agent:
          title: Is registered agent
          type: boolean
        dbas:
          title: Dbas
          type: string
          readOnly: true
        local_address:
          $ref: '#/components/schemas/ExternalAddress'
        created_at:
          title: Created at
          type: string
          format: date-time
        updated_at:
          title: Updated at
          type: string
          format: date-time
    JurisdictionCreate:
      required:
      - name
      - registration_type
      - state_file_number
      type: object
      properties:
        name:
          title: Name
          type: string
          minLength: 1
        registration_type:
          title: Registration type
          type: string
          enum:
          - none
          - primary
          - foreign_qualified
          - registered_agent_only
        status:
          title: Status
          type: string
          enum:
          - pending
          - active
          - inactive
          - terminated
          - dissolved_admin
          - dissolved_voluntary
          - winding_down
          - withdrawn
          - delinquent
          - revoked
          - converted_out
          - merged_out
          - not_required
          - unavailable
          default: active
        state_file_number:
          title: State file number
          type: string
          minLength: 1
        access_code:
          title: Access code
          type:
          - string
          - 'null'
        registration_date:
          title: Registration date
          type:
          - string
          - 'null'
          format: date
        expiration_date:
          title: Expiration date
          type:
          - string
          - 'null'
          format: date
        tax_number:
          title: Tax number
          type:
          - string
          - 'null'
        fictitious_name:
          title: Fictitious name
          type:
          - string
          - 'null'
        local_address:
          $ref: '#/components/schemas/Address'
        dbas:
          type: array
          items:
            type: string
            maxLength: 500
    ExternalAddress:
      type: object
      properties:
        id:
          title: Id
          type:
          - string
