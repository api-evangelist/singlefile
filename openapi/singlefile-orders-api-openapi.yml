          minLength: 1
        share_classes:
          title: Share classes
          type: object
          additionalProperties:
            type: string
            nullable: true
        minority_owned:
          title: Minority owned
          type: boolean
        minority_owner_race:
          title: Minority owner race
          type: string
          minLength: 1
        female_owned:
          title: Female owned
          type: boolean
        document:
          title: Document
          type: object
          additionalProperties:
            type: string
            nullable: true
        previously_authorized:
          title: Previously authorized
          type: boolean
        document_id:
          title: Document id
          type: string
          format: uuid
          nullable: true
        registered_agent:
          title: Registered agent
          type: object
          additionalProperties:
            type: string
            nullable: true
        authorized_person_name:
          title: Authorized person name
          type: string
          minLength: 1
        authorized_partner:
          title: Authorized partner
          type: object
          additionalProperties:
            type: string
            nullable: true
        general_partners:
          type: array
          items:
            type: string
            nullable: true
        additional_data:
